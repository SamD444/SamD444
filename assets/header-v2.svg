
      <svg
        width="854"
        height="200"
        xmlns="http://www.w3.org/2000/svg"
        xmlns:xlink="http://www.w3.org/1999/xlink"
        style="z-index:1;position:relative"
        viewBox="0 0 854 200"
      >
        <style>
      .text {   font-size: 50px;   font-weight: 700;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  } .desc {   font-size: 20px;   font-weight: 500;   font-family: -apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif,Apple Color Emoji,Segoe UI Emoji;  } 
      .text, .desc {   animation: twinkling 4s ease-in-out infinite;  } @keyframes twinkling {   40% {     opacity: 1;   }   50% {     opacity: 0.5;   }   60% {     opacity: 1;   }   70% {     opacity: 0.5;   }   80% {     opacity: 1;   }  } 
    </style>
        <defs>
              <linearGradient id="linear" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#000000"/><stop offset="100%" stop-color="#00A8FF"/>
              </linearGradient>
            </defs>
        
      <g transform="translate(427, 100) scale(1, 1) translate(-427, -100)">
        <path d="" fill="url(#linear)" opacity="0.4" >
          <animate
              attributeName="d"
              dur="20s"
              repeatCount="indefinite"
              keyTimes="0;0.333;0.667;1"
              calcmod="spline"
              keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
              begin="0s"
              values="M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z;M0 0L 0 145Q 213.5 160 427 140T 854 130L 854 0 Z;M0 0L 0 165Q 213.5 135 427 165T 854 130L 854 0 Z;M0 0L 0 120Q 213.5 160 427 130T 854 155L 854 0 Z">
          </animate>
        </path>
        <path d="" fill="url(#linear)" opacity="0.4" >
          <animate
            attributeName="d"
            dur="20s"
            repeatCount="indefinite"
            keyTimes="0;0.333;0.667;1"
            calcmod="spline"
            keySplines="0.2 0 0.2 1;0.2 0 0.2 1;0.2 0 0.2 1"
            begin="-10s"
            values="M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z;M0 0L 0 150Q 213.5 120 427 120T 854 140L 854 0 Z;M0 0L 0 145Q 213.5 125 427 150T 854 165L 854 0 Z;M0 0L 0 135Q 213.5 180 427 150T 854 160L 854 0 Z">
          </animate>
        </path>
      </g>
         <text text-anchor="middle" alignment-baseline="middle" x="50%" y="35%" class="text" style="fill:#ffffff;" stroke="#none" stroke-width="1" >Building the Future in Code 🚀</text>
        
      
  <!-- Easter Egg: Minimalistic Schematic Setup -->
  <g transform="translate(760, 125) scale(0.6)" opacity="0.8">
    <!-- Monitor frame -->
    <rect x="0" y="0" width="80" height="50" rx="2" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <rect x="4" y="4" width="72" height="42" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    
    <!-- Monitor Stand -->
    <line x1="40" y1="50" x2="40" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    <line x1="30" y1="60" x2="50" y2="60" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

    <!-- Terminal Prompt -->
    <line x1="8" y1="12" x2="20" y2="12" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <line x1="8" y1="18" x2="16" y2="18" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <line x1="8" y1="24" x2="25" y2="24" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    
    <!-- Blinking block cursor -->
    <rect x="28" y="20" width="4" height="6" fill="rgba(255,255,255,0.3)">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite" />
    </rect>

    <!-- Keyboard -->
    <g transform="translate(-10, 65)">
      <rect x="0" y="0" width="100" height="20" rx="1" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <!-- Row 1 -->
      <rect x="4" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="14" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="24" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="34" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="44" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="54" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="64" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="74" y="3" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="84" y="3" width="12" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <!-- Row 2 -->
      <rect x="4" y="11" width="12" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="18" y="11" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="28" y="11" width="40" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="70" y="11" width="8" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <rect x="80" y="11" width="16" height="5" rx="0.5" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
    </g>

    <!-- Mouse -->
    <g transform="translate(100, 50)">
      <rect x="0" y="0" width="16" height="24" rx="7" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
      <!-- Scroll wheel -->
      <line x1="8" y1="4" x2="8" y2="8" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
      <!-- Buttons split -->
      <path d="M 0 10 Q 8 12 16 10" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <line x1="8" y1="0" x2="8" y2="10" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
      <!-- Curling Cable -->
      <path d="M 8 0 Q 8 -15 16 -10 T 20 -18" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="0.5" />
    </g>
  </g>

</svg>
    