<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    .card { fill: url(#bg); stroke: rgba(255,255,255,0.08); stroke-width: 1; rx: 12px; transition: all 0.4s ease; }
    .wrapper { transition: transform 0.4s ease; transform-origin: center; cursor: pointer; }
    .wrapper:hover { transform: translateY(-4px) scale(1.01); }
    .wrapper:hover .card { stroke: #8a2be2; filter: url(#glow); }
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-style: italic; fill: #8b949e; }
    .desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; fill: #c9d1d9; font-weight: 400; }
  </style>
  <g class="wrapper">
    <rect x="10" y="10" width="400" height="180" class="card" />
    <text x="30" y="50" class="title">🎮 XSteam</text>
    <text x="30" y="75" class="subtitle">Game Review Intelligence &amp; Analysis API</text>
    <text x="30" y="110" class="desc">A high-performance NLP inference pipeline</text>
    <text x="30" y="130" class="desc">built with FastAPI. Leverages machine learning</text>
    <text x="30" y="150" class="desc">and custom TF-IDF vectorization to instantly</text>
    <text x="30" y="170" class="desc">predict sentiment and score helpfulness.</text>
  </g>
</svg>
