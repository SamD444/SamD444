<svg width="420" height="200" viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.01" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes pulseGlow {
      0%, 100% { stroke: rgba(255,255,255,0.08); filter: none; }
      50% { stroke: #bd93f9; filter: url(#glow); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    .card { 
      fill: url(#bg); 
      stroke-width: 1; 
      rx: 12px; 
      animation: pulseGlow 4.5s ease-in-out infinite; 
      animation-delay: 1.2s;
    }
    .wrapper { 
      transform-origin: center; 
      animation: float 4.5s ease-in-out infinite;
      animation-delay: 1.2s;
    }
    .title { font-family: 'Inter', -apple-system, sans-serif; font-size: 20px; font-weight: 700; fill: #e6edf3; }
    .subtitle { font-family: 'Inter', -apple-system, sans-serif; font-size: 13px; font-style: italic; fill: #8b949e; }
    .desc { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; fill: #c9d1d9; font-weight: 400; }
  </style>
  <g class="wrapper">
    <rect x="10" y="10" width="400" height="180" class="card" />
    <text x="30" y="50" class="title">🛒 CartCoroner AI</text>
    <text x="30" y="75" class="subtitle">Behavioral Analytics &amp; Intelligence</text>
    <text x="30" y="110" class="desc">An AI-driven cart abandonment intelligence</text>
    <text x="30" y="130" class="desc">platform utilizing deep sentiment analysis,</text>
    <text x="30" y="150" class="desc">predictive analytics, and intelligent workflows</text>
    <text x="30" y="170" class="desc">to optimize user retention and conversion.</text>
  </g>
</svg>